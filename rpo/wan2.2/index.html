<style>
/* A viewing room: neutral gray everywhere, so the clips are the only color apart from the two plate colors.
   A = the base model (blue), B = the model after RPO (orange). One file holds both clips of a prompt, A on the
   left and B on the right, so the two halves always show the same frame. */
:root {
  --room: #d7d8da;
  --panel: #e6e7e9;
  --mat: #c3c5c8;
  --ink: #17181a;
  --muted: #50555c;
  --line: #b4b7bc;
  --a: #256abf;
  --b: #c9501c;
  --tagink: #ffffff;
  --engraved: "Copperplate", "Copperplate Gothic Light", "Avenir Next Condensed", "Arial Narrow", sans-serif;
  --cond: "Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --sans: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --serif: Charter, "Iowan Old Style", Georgia, "Times New Roman", serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  /* geometry of one file, set from data.js: width of one clip, the gap between the two, both together, height */
  --half: 1280; --gap: 8; --total: 2568; --vh: 704;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --room: #202124;
    --panel: #2b2d31;
    --mat: #151618;
    --ink: #ececed;
    --muted: #a2a6ad;
    --line: #43464c;
    --a: #3987e5;
    --b: #d95926;
    --tagink: #151618;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--room); }
body {
  margin: 0; background: var(--room); color: var(--ink);
  font-family: var(--sans); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 22px; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* Engraved labels: Copperplate sets lower case as small capitals, so labels are written in normal case. */
.eng { font-family: var(--engraved); letter-spacing: 0.07em; font-size: 13.5px; line-height: 1.2; color: var(--muted); }
.tag {
  display: inline-block; min-width: 22px; padding: 3px 6px 2px; text-align: center;
  font-family: var(--cond); font-weight: 700; font-size: 14px; line-height: 1; color: var(--tagink);
}
.tag.a { background: var(--a); }
.tag.b { background: var(--b); }
.key { display: inline-block; width: 9px; height: 9px; margin-right: 6px; vertical-align: 0; }
.key.a { background: var(--a); }
.key.b { background: var(--b); }

/* ---------- masthead: the comparator is the opening ---------- */
.mast { padding: 26px 0 8px; }
.eyebrow { margin: 0 0 14px; }
.bench { display: grid; grid-template-columns: minmax(0, 640px) minmax(0, 1fr); gap: 34px; align-items: start; }
.bench > *, .stagebox, .readout { min-width: 0; }
h1 {
  margin: 0; font-family: var(--cond); font-weight: 700; letter-spacing: -0.005em;
  font-size: clamp(38px, 4.6vw, 68px); line-height: 0.95;
}
h1 span { color: var(--muted); font-weight: 500; }
.plates { margin: 22px 0 0; display: grid; gap: 10px; }
.plate { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.plate .who { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex-wrap: wrap; }
.plate .name { font-family: var(--cond); font-weight: 600; font-size: 25px; line-height: 1; }
.plate .note { color: var(--muted); font-size: 13.5px; }
.plate .val { font-size: 25px; font-weight: 600; line-height: 1; }
.plate .rail { grid-column: 2 / 4; }
.rail { height: 10px; position: relative; overflow: hidden; }
.rail.a { background: color-mix(in srgb, var(--a) 20%, var(--panel)); }
.rail.b { background: color-mix(in srgb, var(--b) 20%, var(--panel)); }
.rail i { position: absolute; inset: 0 auto 0 0; width: var(--w, 0%); border-radius: 0 3px 3px 0; }
.rail.a i { background: var(--a); }
.rail.b i { background: var(--b); }
.meant { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
.headline { margin: 20px 0 0; font-size: 19px; line-height: 1.35; max-width: 34em; }
.headline b { font-weight: 600; }
.lede { margin: 12px 0 0; max-width: 40em; color: var(--muted); }
.lede b { color: var(--ink); font-weight: 600; }

/* ---------- the stage: one playing file, shown as both clips, one clip, or a wipe between the two ---------- */
.stage {
  position: relative; aspect-ratio: var(--half) / var(--vh); background: var(--mat); overflow: hidden;
  --x: 50%; touch-action: pan-y;
}
.stage[data-mode="pair"] { aspect-ratio: var(--total) / var(--vh); }
.stage[data-mode="wipe"] { cursor: ew-resize; }
/* the file is wider than the stage unless both clips show: A sits at the left edge, B is slid into its place */
.stage video {
  position: absolute; top: 0; left: 0; height: 100%; max-width: none; display: block; background: var(--mat);
  width: calc(100% * var(--total) / var(--half));
}
.stage[data-mode="b"] video { transform: translateX(calc(-100% * (var(--half) + var(--gap)) / var(--total))); }
.stage[data-mode="pair"] video { width: 100%; }
/* wipe: the video shows A, this canvas paints B to the right of the line from the same frame */
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: none; pointer-events: none; }
.stage[data-mode="wipe"] canvas { display: block; }
.stage .rule {
  position: absolute; top: 0; bottom: 0; left: var(--x); width: 2px; margin-left: -1px; display: none;
  background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5); pointer-events: none;
}
.stage .grip {
  position: absolute; top: 50%; left: var(--x); width: 38px; height: 38px; margin: -19px 0 0 -19px;
  border-radius: 50%; border: 2px solid #fff; background: #17181a; color: #fff; padding: 0;
  display: none; place-items: center; cursor: ew-resize; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5);
}
.stage .grip svg { width: 20px; height: 20px; display: block; }
.stage[data-mode="wipe"] .rule { display: block; }
.stage[data-mode="wipe"] .grip { display: grid; }
.stage .corner { position: absolute; top: 8px; display: flex; align-items: center; gap: 6px; pointer-events: none; }
.stage .corner.ca { left: 8px; }
.stage .corner.cb { right: 8px; }
.stage .corner .sc {
  font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums;
  background: rgba(23, 24, 26, 0.78); color: #fff; padding: 2px 6px;
}
.stage[data-mode="a"] .corner.cb, .stage[data-mode="b"] .corner.ca { opacity: 0.28; }
.stage:focus { outline: none; }
.stagebar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 5px 11px; font-size: 13.5px; line-height: 1.3; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--room); }
.seg button.sa[aria-pressed="true"] { background: var(--a); color: var(--tagink); }
.seg button.sb[aria-pressed="true"] { background: var(--b); color: var(--tagink); }
.plain { border: 1px solid var(--line); background: var(--panel); padding: 5px 11px; font-size: 13.5px; line-height: 1.3; }
.featured { margin: 10px 0 0; }
.featured .why { display: block; margin-bottom: 3px; }
.cap { font-family: var(--serif); font-style: italic; font-size: 16px; line-height: 1.4; margin: 0; overflow-wrap: anywhere; }
/* the prompts are long clip descriptions: three lines, then a switch for the rest */
.cap.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
.more {
  border: 0; background: transparent; padding: 0; margin-top: 2px; color: var(--muted);
  font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px;
}

/* ---------- gain per prompt ---------- */
.gains { margin: 26px 0 0; max-width: 860px; }
.gains h2 { margin: 0 0 2px; font-family: var(--cond); font-weight: 600; font-size: 22px; line-height: 1.1; }
.gains .sub { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; }
.plot { position: relative; height: 168px; margin: 0 0 4px 44px; }
.plot .grid { position: absolute; left: 0; right: 0; height: 1px; background: var(--line); }
.plot .grid.zero { background: var(--muted); }
.plot .grid span { position: absolute; right: 100%; top: -9px; margin-right: 8px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.plot .bars { position: absolute; inset: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
.plot .slot { position: relative; border: 0; padding: 0; background: transparent; min-width: 0; }
.plot .slot i { position: absolute; left: 50%; width: clamp(3px, 58%, 14px); transform: translateX(-50%); min-height: 1px; }
.plot .slot.up i { background: var(--b); border-radius: 4px 4px 0 0; }
.plot .slot.down i { background: var(--a); border-radius: 0 0 4px 4px; }
.plot .slot:hover, .plot .slot:focus-visible { background: color-mix(in srgb, var(--ink) 9%, transparent); outline: none; }
.plot .slot:focus-visible { box-shadow: inset 0 0 0 2px var(--ink); }
.axisnote { display: flex; flex-wrap: wrap; gap: 4px 18px; justify-content: space-between; margin: 6px 0 0 44px; color: var(--muted); font-size: 13px; }
.legend { display: flex; gap: 16px; }
.tip {
  position: fixed; z-index: 30; pointer-events: none; display: none; max-width: 300px;
  background: var(--ink); color: var(--room); padding: 8px 10px 9px; font-size: 13px; line-height: 1.35;
}
.tip b { display: block; font-size: 17px; font-weight: 600; line-height: 1.2; }
.tip .row { display: block; opacity: 0.86; }
.tip .p { display: block; margin-top: 4px; font-family: var(--serif); font-style: italic; opacity: 0.86; }

/* ---------- sticky controls: one row, above everything it filters ---------- */
.deck {
  position: sticky; top: 0; z-index: 10; background: var(--room); margin-top: 26px;
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
}
.deck .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; padding-top: 9px; padding-bottom: 9px; }
.ctl { display: flex; align-items: center; gap: 8px; }
select { background: var(--panel); border: 1px solid var(--line); padding: 5px 8px; font-size: 13.5px; }
.count { margin-left: auto; color: var(--muted); font-size: 13.5px; }

/* ---------- one card per prompt ---------- */
#cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(var(--card, 680px), 100%), 1fr)); gap: 18px; padding-top: 18px; padding-bottom: 10px; }
.card { background: var(--panel); min-width: 0; scroll-margin-top: calc(var(--deck, 60px) + 12px); }
.card.hit { box-shadow: 0 0 0 2px var(--ink); }
#cards[data-size="l"] .card { width: 100%; max-width: 1400px; margin: 0 auto; }
#cards[data-size="l"][data-view="wipe"] .card { max-width: 1040px; }
.card header { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 11px 12px 10px; }
.card .no { font-family: var(--engraved); letter-spacing: 0.05em; font-size: 14px; line-height: 1.5; color: var(--muted); white-space: nowrap; }
.card .gain { text-align: right; white-space: nowrap; font-size: 19px; font-weight: 600; line-height: 1.2; }
.card .gain small { display: block; font-size: 11.5px; font-weight: 400; color: var(--muted); }
.card .stage { cursor: zoom-in; }
.empty { grid-column: 1 / -1; background: var(--panel); padding: 26px 20px; }
.empty p { margin: 0 0 12px; }

.foot { padding: 14px 22px 40px; color: var(--muted); font-size: 13px; }
.foot p { margin: 0 0 4px; max-width: 86em; }

/* ---------- large view ---------- */
dialog.scope {
  border: 0; padding: 0; margin: 0; width: 100vw; height: 100vh; max-width: none; max-height: none;
  background: var(--room); color: var(--ink);
}
dialog.scope::backdrop { background: var(--room); }
.scope .lay { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 400px); gap: 26px; height: 100%; padding: 18px 22px; align-items: start; overflow: auto; }
.scope[data-wide] .lay { grid-template-columns: minmax(0, 1fr); }
.scope .main { min-width: 0; display: grid; gap: 10px; justify-items: center; }
.scope .stage { width: min(100%, calc((100vh - 120px) * var(--half) / var(--vh))); }
.scope .stage[data-mode="pair"] { width: 100%; }
.transport { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; width: 100%; }
.transport input[type="range"] { flex: 1 1 180px; min-width: 120px; accent-color: var(--ink); }
.transport .time { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.scope .side { display: grid; gap: 14px; align-content: start; min-width: 0; max-height: calc(100vh - 36px); overflow: auto; padding-right: 2px; }
.scope[data-wide] .side { max-height: none; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); column-gap: 26px; }
.scope .side .seg { justify-self: start; }
.scope .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.scope .no { font-family: var(--cond); font-weight: 600; font-size: 30px; line-height: 1; }
.scope .no small { font-family: var(--sans); font-weight: 400; font-size: 13.5px; color: var(--muted); margin-left: 8px; }
.scope .cap { font-size: 17px; }
.scope table { width: 100%; border-collapse: collapse; font-size: 15px; }
.scope td { padding: 7px 6px; border-bottom: 1px solid var(--line); }
.scope td:last-child { text-align: right; }
.scope tr.sum td { font-weight: 600; border-bottom: 0; }
.scope .keys { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
.scope .keys kbd { font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); padding: 0 4px; background: var(--panel); color: var(--ink); }
.scope .nav { display: flex; flex-wrap: wrap; gap: 8px; }

@media (max-width: 1020px) {
  .bench { grid-template-columns: minmax(0, 1fr); gap: 22px; }
  .bench .stagebox { max-width: 640px; }
  .scope .lay { grid-template-columns: minmax(0, 1fr); }
  .scope .side { max-height: none; }
}
@media (max-width: 760px) {
  .deck { position: static; }
}
@media (max-width: 560px) {
  .wrap { padding: 0 14px; }
  .plot { margin-left: 38px; }
  .axisnote { margin-left: 0; }
  .count { margin-left: 0; }
  .scope .lay { padding: 14px; }
}
</style>

  }
  function renderCards() {
    cardStages.forEach(function (st) { st.dispose(); });
    live = live.filter(function (st) { return cardStages.indexOf(st) < 0; });
    cardStages = [];
    view = hasScores ? items.filter(function (it) {
      var g = gainOf(it);
      return state.show === "all" || (state.show === "b" ? g > 0 : g < 0);
    }) : items.slice();
    var key = hasScores ? { gainDesc: function (it) { return -gainOf(it); }, gainAsc: gainOf,
                baseAsc: function (it) { return it.a; }, bDesc: function (it) { return -it.b; } }[state.sort] : null;
    if (key) view.sort(function (p, q) { return key(p) - key(q) || p.i - q.i; });
    cards.textContent = "";
    cards.style.setProperty("--card", CARD[state.view][state.size]); cards.dataset.size = state.size; cards.dataset.view = state.view;
    if (!view.length) {
      var e = el("div", "empty");
      e.appendChild(el("p", null, state.show === "a" ? "A does not score higher on any prompt." : "No prompt matches."));
      var b = el("button", "plain", "Show all prompts"); b.type = "button"; b.dataset.reset = "1"; e.appendChild(b); cards.appendChild(e);
    } else {
      var frag = document.createDocumentFragment(); view.forEach(function (it) { frag.appendChild(card(it)); }); cards.appendChild(frag);
    }
    document.getElementById("count").textContent = view.length + " of " + items.length + " prompts";
  }
  cards.addEventListener("click", function (e) {
    if (e.target.closest("[data-reset]")) { state.show = "all"; press(document.getElementById("segShow"), "data-v", "all"); renderCards(); return; }
    var o = e.target.closest("[data-open]"); if (o) openScope(+o.dataset.open);
  });
  cards.addEventListener("keydown", function (e) {
    var o = e.target.closest(".stage[data-open]"); if (o && e.target === o && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openScope(+o.dataset.open); }
  });
  cards.addEventListener("pointermove", function (e) {          // wipe view: the line follows the pointer
    var node = e.target.closest(".card .stage"); if (!node || node.dataset.mode !== "wipe" || !node._stage) return;
    var r = node.getBoundingClientRect(); node._stage.setX(100 * (e.clientX - r.left) / r.width);
  });

  // ---------- controls ----------
  function bindSeg(id, prop, after) {
    var g = document.getElementById(id);
    g.addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; state[prop] = b.dataset.v; press(g, "data-v", b.dataset.v); after(); });
  }
  bindSeg("segShow", "show", renderCards); bindSeg("segSize", "size", renderCards); bindSeg("segView", "view", renderCards);
  var segMotion = document.getElementById("segMotion");
  press(segMotion, "data-v", state.motion ? "on" : "off");
  segMotion.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    state.motion = b.dataset.v === "on"; press(segMotion, "data-v", b.dataset.v); settleAll();
  });
  document.getElementById("selSort").addEventListener("change", function (e) { state.sort = e.target.value; renderCards(); });
  var deck = document.getElementById("deck");
  function deckH() { document.documentElement.style.setProperty("--deck", deck.offsetHeight + "px"); }
  window.addEventListener("resize", deckH);

  // ---------- large view ----------
  var scope = document.getElementById("scope"), scopeNode = document.getElementById("scopeStage"), scopeModes = document.getElementById("scopeModes");
  var tPlay = document.getElementById("tPlay"), tScrub = document.getElementById("tScrub"), tTime = document.getElementById("tTime"), tSpeed = document.getElementById("tSpeed");
  var sc = { i: 0, rate: 1 };
  var big = new Stage(scopeNode, true), bv = big.video;
  var scrubbing = false;
  big.onTime = function () {
    var d = isFinite(bv.duration) && bv.duration > 0 ? bv.duration : S.frames / S.fps;
    var frame = Math.max(1, Math.min(S.frames, Math.floor(bv.currentTime * S.fps + 1e-6) + 1));
    if (!scrubbing) tScrub.value = String(Math.round(1000 * Math.min(1, bv.currentTime / d)));
    tTime.textContent = bv.currentTime.toFixed(2) + " s · frame " + frame + " of " + S.frames;
    tPlay.textContent = bv.paused ? "Play" : "Pause";
  };
  function scopeMode(mode) {
    big.setMode(mode); press(scopeModes, "data-mode", mode);
    if (mode === "pair") scope.setAttribute("data-wide", ""); else scope.removeAttribute("data-wide");
    big.fit();
  }
  function scopeList() { return view.some(function (it) { return it.i === sc.i; }) ? view : items; }
  function scopeShow() {
    var it = items[sc.i], rows = document.getElementById("scopeRows"), list = scopeList(), at = list.indexOf(it);
    big.load(it, true);
    bv.defaultPlaybackRate = sc.rate; bv.playbackRate = sc.rate;
    if (state.motion) big.play(); else bv.load();
    big.onTime();
    var no = document.getElementById("scopeNo"); no.textContent = "Prompt " + it.i;
    no.appendChild(el("small", null, (at + 1) + " of " + list.length));
    document.getElementById("scopeCap").textContent = it.prompt;
    rows.textContent = "";
    [["a", "A · " + M.a.name, hasScores ? f2(it.a) : "base"], ["b", "B · " + M.b.name.replace(/^\+\s*/, ""), hasScores ? f2(it.b) : "RPO"]].forEach(function (c) {
      var tr = el("tr"), td = el("td"); td.appendChild(el("i", "key " + c[0])); td.appendChild(document.createTextNode(c[1]));
      tr.appendChild(td); tr.appendChild(el("td", "num", c[2])); rows.appendChild(tr);
    });
    if (hasScores) { var sum = el("tr", "sum"); sum.appendChild(el("td", null, "Gain")); sum.appendChild(el("td", "num", sg(gainOf(it)))); rows.appendChild(sum); }
    [list[at - 1], list[at + 1]].forEach(function (nb) { if (nb) new Image().src = stillSrc(nb.i); });
  }
  function openScope(i) {
    sc.i = i; suspended = true; settleAll();
    if (!scope.open) scope.showModal();
    scopeMode("wipe"); big.setX(50); scopeShow();
    scopeNode.focus({ preventScroll: true });
  }
  function scopeMove(d) {
    var list = scopeList(), at = list.indexOf(items[sc.i]), nb = list[at + d];
    if (nb) { sc.i = nb.i; scopeShow(); }
  }
  function togglePlay() { if (bv.paused) big.play(); else big.pause(); }
  function stepFrame(d) {
    if (!(bv.readyState >= 1)) return;
    big.pause();
    var n = Math.max(0, Math.min(S.frames - 1, Math.floor(bv.currentTime * S.fps + 1e-6) + d));
    bv.currentTime = (n + 0.5) / S.fps;
  }
  scope.addEventListener("close", function () {
    big.pause(); bv.removeAttribute("src"); bv.load();
    suspended = false; settleAll();
  });
  scopeModes.addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) scopeMode(b.dataset.mode); });
  tPlay.addEventListener("click", togglePlay);
  document.getElementById("tBack").addEventListener("click", function () { stepFrame(-1); });
  document.getElementById("tFwd").addEventListener("click", function () { stepFrame(1); });
  tScrub.addEventListener("input", function () {
    if (!(bv.readyState >= 1) || !isFinite(bv.duration)) return;
    scrubbing = true; bv.currentTime = Math.min(bv.duration - 0.001, bv.duration * Number(tScrub.value) / 1000);
  });
  ["change", "pointerup", "keyup"].forEach(function (t) { tScrub.addEventListener(t, function () { scrubbing = false; }); });
  tSpeed.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    sc.rate = Number(b.dataset.v); bv.defaultPlaybackRate = sc.rate; bv.playbackRate = sc.rate; press(tSpeed, "data-v", b.dataset.v);
  });
  document.getElementById("scopePrev").addEventListener("click", function () { scopeMove(-1); });
  document.getElementById("scopeNext").addEventListener("click", function () { scopeMove(1); });
  document.getElementById("scopeClose").addEventListener("click", function () { scope.close(); });
  document.addEventListener("keydown", function (e) {
    if (!scope.open || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target === tScrub && (e.key === "ArrowLeft" || e.key === "ArrowRight")) return;   // the slider's own keys
    var k = e.key;
    if (k === " ") { e.preventDefault(); if (!e.repeat) scopeMode(scopeNode.dataset.mode === "b" ? "a" : "b"); }
    else if (k === "w" || k === "W") scopeMode("wipe");
    else if (k === "s" || k === "S") scopeMode("pair");
    else if (k === "a" || k === "A") scopeMode("a");
    else if (k === "b" || k === "B") scopeMode("b");
    else if (k === "p" || k === "P") togglePlay();
    else if (k === ",") stepFrame(-1);
    else if (k === ".") stepFrame(1);
    else if (k === "ArrowLeft") { e.preventDefault(); scopeMove(-1); }
    else if (k === "ArrowRight") { e.preventDefault(); scopeMove(1); }
  });
  document.addEventListener("keyup", function (e) { if (scope.open && e.key === " ") e.preventDefault(); });   // a focused button must not also fire

  // ---------- footer ----------
  var foot = document.getElementById("foot");
  foot.appendChild(el("p", null, "Both models are sampled with the same settings: " + settings +
    ", and the same starting noise for the two clips of a pair."));
  foot.appendChild(el("p", null, "Each file in " + V.dir + "/ holds both clips of one prompt, A on the left and B on the right. The replacement set does not include matching score data."));

  // ---------- first paint ----------
  renderCards(); deckH();
})();
</script>
</body>
</html>
